services:
  postgres:
    image: postgres:16
    container_name: sqlagent_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sqlagent_redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: sqlagent_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/code/app
      - ./tests:/code/tests

  worker:
    build: .
    container_name: sqlagent_worker
    command: celery -A app.worker.tasks worker --loglevel=info --pool=solo
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/code/app
      - ./tests:/code/tests

volumes:
  postgres_data: